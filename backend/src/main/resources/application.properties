# Server Configuration
server.port=8080
server.servlet.context-path=/api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/file_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=012012

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true



# Schema initialization
spring.sql.init.mode=never

# Logging
logging.level.root=INFO
logging.level.com.example.filemanagement=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration
app.jwtSecret=MyVerySecureJWTSecretKeyForFileManagementSystemWithMinimumLength256BitRequiredForHS256Algorithm
app.jwtExpirationMs=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Application Name
spring.application.name=File Management System
